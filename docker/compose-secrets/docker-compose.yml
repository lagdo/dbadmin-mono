version: "3"

services:
  backend:
    container_name: infisical-backend
    restart: unless-stopped
    depends_on:
      pgsql:
        # condition: service_healthy
        condition: service_started
      redis:
        condition: service_started
    image: infisical/infisical:v0.157.0
    # pull_policy: always
    env_file: .env
    ports:
      - 7095:8080
    environment:
      - NODE_ENV=production
    networks:
      - infisical

  redis:
    image: redis
    container_name: infisical-redis
    env_file: .env
    restart: always
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    networks:
      - infisical
    volumes:
      - infisical_redis_data:/data

  pgsql:
    container_name: infisical-pgsql
    image: postgres:14-alpine
    restart: always
    env_file: .env
    volumes:
      - infisical_pgsql_data:/var/lib/postgresql/data
    networks:
      - infisical
    # healthcheck:
    #   test: "pg_isready --username=${POSTGRES_USER} && psql --username=${POSTGRES_USER} --list"
    #   interval: 5s
    #   timeout: 10s
    #   retries: 10

  ministack:
    container_name: ministack
    image: ministackorg/ministack:latest
    ports:
      - "4566:4566"
    volumes:
      - ministack_server_data:/tmp/ministack-state
    environment:
      - PERSIST_STATE=1
      - AWS_DEFAULT_REGION=us-east-1

  # Disabled because for now, Floci doesn't provide secrets persistance, while Ministack does.
  # floci:
  #   container_name: floci
  #   image: hectorvent/floci:latest
  #   ports:
  #     - "4566:4566"
  #   environment:
  #     - FLOCI_STORAGE_MODE=persistent
  #     - FLOCI_STORAGE_PERSISTENT_PATH=/data/floci
  #     - FLOCI_DEFAULT_REGION=us-east-1
  #   volumes:
  #     - floci_server_data:/data/floci

volumes:
  infisical_pgsql_data:
    driver: local
    name: infisical_pgsql_data
  infisical_redis_data:
    driver: local
    name: infisical_redis_data
  # floci_server_data:
  #   driver: local
  #   name: floci_server_data
  ministack_server_data:
    driver: local
    name: ministack_server_data

networks:
  infisical:
