services:

  dbadmin-demo:
    container_name: dbadmin-demo
    build:
      context: ./
      dockerfile: demo/Dockerfile
      args:
        - PHP_USER=dbadmin
        - PHP_UID=${PHP_UID:-1000}
        - PHP_GID=${PHP_GID:-1000}
    volumes:
      - ./config/mysql/disable-ssl.cnf:/etc/my.cnf.d/disable-ssl.cnf
      - ..:/var/www
      - ./sqlite:/var/lib/sqlite
    ports:
      - 7090:8080
    networks:
      - dbadmin-dev-net
    extra_hosts:
      - "postgresql.addr=host-gateway"

  dbadmin-dev:
    container_name: dbadmin-dev
    build:
      context: ./
      dockerfile: dev/Dockerfile
      args:
        - PHP_USER=dbadmin
        - PHP_UID=${PHP_UID:-1000}
        - PHP_GID=${PHP_GID:-1000}
    volumes:
      - ../../dbadmin-app:/var/www
      - ./exports:/home/dbadmin/exports
      - ./config/app/.env.dbadmin:/var/www/.env.dbadmin
      - ./config/app/dbadmin.json:/var/www/config/dbadmin.json
      - ./config/app/dbadmin.php:/var/www/config/dbadmin.php
      - ./config/app/jaxon.php:/var/www/config/jaxon.php
      - ./sqlite:/var/lib/sqlite
      - ./sqlite/3/database.sqlite:/var/www/database/database.sqlite:rw
    ports:
      - 7091:8080
    networks:
      - dbadmin-dev-net
    extra_hosts:
      - "postgresql.addr=host-gateway"

  dbadmin-app:
    container_name: dbadmin-app
    image: lagdo/jaxon-dbadmin
    restart: always
    volumes:
      - ./exports:/home/dbadmin/exports
      - ./config/app/.env.dbadmin:/var/www/.env.dbadmin
      - ./config/app/dbadmin.json:/var/www/config/dbadmin.json
      - ./config/app/dbadmin.php:/var/www/config/dbadmin.php
      - ./config/app/jaxon.php:/var/www/config/jaxon.php
      - ./sqlite:/var/lib/sqlite
      - ./sqlite/3/database.sqlite:/var/www/database/database.sqlite:rw
    ports:
      - 7092:8080
    networks:
      - dbadmin-dev-net
    extra_hosts:
      - "postgresql.addr=host-gateway"

networks:
  dbadmin-dev-net:
    driver: bridge
