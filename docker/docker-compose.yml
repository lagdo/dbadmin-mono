services:

  dbadmin:
    container_name: dbadmin
    build:
      context: ./
      dockerfile: dbadmin/Dockerfile
      args:
        - PHP_USER=dbadmin
        - PHP_UID=${PHP_UID:-1000}
        - PHP_GID=${PHP_GID:-1000}
    volumes:
      - ..:/var/www
      - ./sqlite:/var/lib/sqlite
      - ./sh/mysql/my.cnf:/root/.my.cnf:ro
    ports:
      - 8090:8080
    networks:
      - dbadmin-demo
    extra_hosts:
      - "postgresql.addr=host-gateway"

  dbadmin-app:
    container_name: dbadmin-app
    image: lagdo/jaxon-dbadmin:0.1.5
    restart: always
    volumes:
      - ./dbadmin/config/dbadmin.json:/var/www/config/dbadmin.json
      - ./sh/mysql/my.cnf:/root/.my.cnf:ro
    ports:
      - 8091:8080
    networks:
      - dbadmin-demo
    extra_hosts:
      - "postgresql.addr=host-gateway"

  # adminer:
  #   container_name: adminer
  #   image: adminer
  #   restart: always
  #   ports:
  #     - 8092:8080
  #   networks:
  #     - dbadmin-demo

  db-mariadb:
    container_name: db-mariadb
    image: mariadb:10-ubi
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: dbadmin
    networks:
      - dbadmin-demo

  db-mysql:
    container_name: db-mysql
    image: mysql/mysql-server:8.0
    restart: always
    command: ["mysqld", "--default-authentication-plugin=mysql_native_password"]
    environment:
      MYSQL_ROOT_PASSWORD: dbadmin
    networks:
      - dbadmin-demo

  db-postgresql:
    container_name: db-postgresql
    image: postgres:14.15-alpine3.21
    restart: always
    # set shared memory limit when using docker-compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    #volumes:
    #  - type: tmpfs
    #    target: /dev/shm
    #    tmpfs:
    #      size: 134217728 # 128*2^20 bytes = 128Mb
    environment:
      POSTGRES_PASSWORD: dbadmin
    networks:
      - dbadmin-demo

networks:
  dbadmin-demo:
    driver: bridge
