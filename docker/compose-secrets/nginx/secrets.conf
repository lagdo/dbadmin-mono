server {
    listen 443 ssl;
    server_name  inf.secrets.loc;

    ssl_certificate     /etc/nginx/ssl/secrets.loc.crt;
    ssl_certificate_key /etc/nginx/ssl/secrets.loc.key;

    access_log  /var/log/nginx/inf.secrets.access.log main;
    error_log   /var/log/nginx/inf.secrets.error.log debug;

    location / {
        proxy_pass http://inf.secrets:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

