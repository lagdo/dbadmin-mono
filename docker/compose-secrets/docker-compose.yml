services:

  secrets-certs:
    container_name: secrets-certs
    build:
      context: ./
      dockerfile: certs/Dockerfile
    volumes:
      - ../ssl:/data/ssl

  secrets-nginx:
    container_name: secrets-nginx
    depends_on:
      secrets-certs:
        condition: service_completed_successfully
    build:
      context: ./
      dockerfile: nginx/Dockerfile
    volumes:
      - ../ssl:/etc/nginx/ssl
      - ./nginx/secrets.conf:/etc/nginx/conf.d/secrets.conf
    restart: always
    ports:
      - 7200:80
      - 7201:443
    networks:
      secrets-net:
      secrets-ssl-net:
        aliases:
          - inf.secrets.loc
          - aws.secrets.loc
          - gcp.secrets.loc
          - bao.secrets.loc

  secrets-infisical:
    image: infisical/infisical:v0.160.7
    container_name: infisical-backend
    restart: unless-stopped
    depends_on:
      pgsql:
        # condition: service_healthy
        condition: service_started
      redis:
        condition: service_started
    # pull_policy: always
    env_file: .env
    expose:
      - 8080
    environment:
      - NODE_ENV=production
    networks:
      infisical-net:
      secrets-net:
        aliases:
          - inf.secrets

  redis:
    image: redis
    container_name: infisical-redis
    env_file: .env
    restart: always
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    networks:
      - infisical-net
    volumes:
      - infisical_redis_data:/data

  pgsql:
    container_name: infisical-pgsql
    image: postgres:14-alpine
    restart: always
    env_file: .env
    volumes:
      - infisical_pgsql_data:/var/lib/postgresql/data
    networks:
      - infisical-net
    # healthcheck:
    #   test: "pg_isready --username=${POSTGRES_USER} && psql --username=${POSTGRES_USER} --list"
    #   interval: 5s
    #   timeout: 10s
    #   retries: 10

  secrets-ministack:
    container_name: ministack
    image: ministackorg/ministack:latest
    expose:
      - 4566
    volumes:
      - ministack_server_data:/tmp/ministack-state
    environment:
      - PERSIST_STATE=1
      - LOCALSTACK_PERSISTENCE=1
      - AWS_DEFAULT_REGION=us-east-1
    networks:
      secrets-net:
        aliases:
          - aws.secrets

  # GCP
  # gcp-iam-emulator:
  #   container_name: gcp-iam-emulator
  #   image: ghcr.io/blackwell-systems/gcp-iam-emulator:latest
  #   expose:
  #     - 8080
  #   environment:
  #     - IAM_PORT=8080
  #     - IAM_LOG_LEVEL=info
  #   healthcheck:
  #     test: ["CMD", "wget", "--spider", "-q", "http://localhost:7202/health"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 5

  secrets-gcp-emulator:
    container_name: gcp-secret-emulator
    image: ghcr.io/blackwell-systems/gcp-secret-manager-emulator-dual:latest
    expose:
      - 9090  # gRPC
      - 8080  # REST (avoid conflict with IAM)
    environment:
      - GCP_MOCK_GRPC_PORT=9090
      - GCP_MOCK_HTTP_PORT=8080
      - IAM_MODE=off # permissive
      - IAM_EMULATOR_HOST=gcp-iam-emulator:8080
    # depends_on:
    #   gcp-iam-emulator:
    #     condition: service_healthy
    networks:
      secrets-net:
        aliases:
          - gcp.secrets

  secrets-openbao:
    container_name: openbao
    image: openbao/openbao
    volumes:
      - openbao_server_data:/openbao/config
    expose:
      - 8200
    environment:
      - BAO_DEV_ROOT_TOKEN_ID=dbadmin
      - BAO_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    networks:
      secrets-net:
        aliases:
          - bao.secrets

  # azure-vault:
  #   container_name: azure-vault
  #   image: jamesgoulddev/azure-keyvault-emulator:latest
  #   volumes:
  #     - ../certs/azure:/certs
  #   expose:
  #     - 4997
  #   environment:
  #     - Persist=true
  #   networks:
  #     secrets-net:
  #       aliases:
  #         - azr.secrets

volumes:
  infisical_pgsql_data:
    driver: local
    name: infisical_pgsql_data
  infisical_redis_data:
    driver: local
    name: infisical_redis_data
  ministack_server_data:
    driver: local
    name: ministack_server_data
  openbao_server_data:
    driver: local
    name: openbao_server_data

networks:
  infisical-net:
    name: infisical-net
  secrets-net:
    name: secrets-net
  secrets-ssl-net:
    name: secrets-ssl-net
