services:

  dbadmin-img:
    container_name: dbadmin-img
    image: lagdo/jaxon-dbadmin:0.2
    restart: always
    volumes:
      - ./config/dbadmin.json:/var/www/config/dbadmin.json
      - ./config/dbadmin.php:/var/www/config/dbadmin.php
      - ./sh/mysql/my.cnf:/root/.my.cnf:ro
    ports:
      - 7090:8080
    networks:
      - dbadmin-demo
    extra_hosts:
      - "postgresql.addr=host-gateway"

  dbadmin-demo:
    container_name: dbadmin-demo
    build:
      context: ./
      dockerfile: demo/Dockerfile
      args:
        - PHP_USER=dbadmin
        - PHP_UID=${PHP_UID:-1000}
        - PHP_GID=${PHP_GID:-1000}
    volumes:
      - ..:/var/www
      - ./sqlite:/var/lib/sqlite
      - ./sh/mysql/my.cnf:/root/.my.cnf:ro
    ports:
      - 7091:8080
    networks:
      - dbadmin-demo
    extra_hosts:
      - "postgresql.addr=host-gateway"

  dbadmin-app:
    container_name: dbadmin-app
    build:
      context: ./
      dockerfile: app/Dockerfile
      args:
        - PHP_USER=dbadmin
        - PHP_UID=${PHP_UID:-1000}
        - PHP_GID=${PHP_GID:-1000}
    volumes:
      - ../../dbadmin-app:/var/www
      - ./sqlite:/var/lib/sqlite
      - ./sh/mysql/my.cnf:/root/.my.cnf:ro
    ports:
      - 7092:8080
    networks:
      - dbadmin-demo
    extra_hosts:
      - "postgresql.addr=host-gateway"

  dbadmin-adminer:
    container_name: dbadmin-adminer
    image: adminer
    restart: always
    ports:
      - 7093:8080
    networks:
      - dbadmin-demo

  dbadmin-phpmyadmin:
    container_name: dbadmin-phpmyadmin
    image: phpmyadmin
    restart: always
    environment:
      - PMA_HOST=dbadmin-mariadb
    ports:
      - 7094:80
    networks:
      - dbadmin-demo

  dbadmin-mariadb:
    container_name: dbadmin-mariadb
    image: mariadb:10-ubi
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: dbadmin
    networks:
      - dbadmin-demo

  dbadmin-mysql:
    container_name: dbadmin-mysql
    image: mysql/mysql-server:8.0
    restart: always
    command: ["mysqld", "--default-authentication-plugin=mysql_native_password"]
    environment:
      MYSQL_ROOT_PASSWORD: dbadmin
    networks:
      - dbadmin-demo

  dbadmin-pgsql:
    container_name: dbadmin-pgsql
    image: postgres:14.15-alpine3.21
    restart: always
    # set shared memory limit when using docker-compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    #volumes:
    #  - type: tmpfs
    #    target: /dev/shm
    #    tmpfs:
    #      size: 134217728 # 128*2^20 bytes = 128Mb
    environment:
      POSTGRES_PASSWORD: dbadmin
    networks:
      - dbadmin-demo

  dbadmin-pgsql17:
    container_name: dbadmin-pgsql17
    image: postgres:17-alpine3.21
    restart: always
    # set shared memory limit when using docker-compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    #volumes:
    #  - type: tmpfs
    #    target: /dev/shm
    #    tmpfs:
    #      size: 134217728 # 128*2^20 bytes = 128Mb
    environment:
      POSTGRES_PASSWORD: dbadmin
    networks:
      - dbadmin-demo

networks:
  dbadmin-demo:
    driver: bridge
