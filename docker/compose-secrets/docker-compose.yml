services:

  secrets-certs:
    container_name: secrets-certs
    build:
      context: ./
      dockerfile: certs/Dockerfile
    volumes:
      - ../ssl:/data/ssl

  secrets-nginx:
    container_name: secrets-nginx
    depends_on:
      secrets-certs:
        condition: service_completed_successfully
    build:
      context: ./
      dockerfile: nginx/Dockerfile
    volumes:
      - ../ssl:/etc/nginx/ssl
      - ./nginx/secrets.conf:/etc/nginx/conf.d/secrets.conf
    restart: always
    ports:
      - 7200:80
      - 7201:443
    networks:
      secrets-net:
      secrets-ssl-net:
        aliases:
          - inf.secrets.loc
          - aws.secrets.loc
          - gcp.secrets.loc
          - bao.secrets.loc
          - floci.secrets.loc
          - floci-aws.secrets.loc
          - floci-azr.secrets.loc
          - floci-gcp.secrets.loc

  secrets-infisical:
    image: infisical/infisical:v0.160.7
    container_name: infisical-backend
    restart: unless-stopped
    depends_on:
      pgsql:
        # condition: service_healthy
        condition: service_started
      redis:
        condition: service_started
    # pull_policy: always
    env_file: .env
    expose:
      - 8080
    environment:
      - NODE_ENV=production
    networks:
      infisical-net:
      secrets-net:
        aliases:
          - inf.secrets

  redis:
    image: redis
    container_name: infisical-redis
    env_file: .env
    restart: always
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    networks:
      - infisical-net
    volumes:
      - infisical_redis_data:/data

  pgsql:
    container_name: infisical-pgsql
    image: postgres:14-alpine
    restart: always
    env_file: .env
    volumes:
      - infisical_pgsql_data:/var/lib/postgresql/data
    networks:
      - infisical-net
    # healthcheck:
    #   test: "pg_isready --username=${POSTGRES_USER} && psql --username=${POSTGRES_USER} --list"
    #   interval: 5s
    #   timeout: 10s
    #   retries: 10

  secrets-ministack:
    container_name: ministack
    image: ministackorg/ministack:latest
    expose:
      - 4566
    volumes:
      - ministack_server_data:/tmp/ministack-state
    environment:
      - PERSIST_STATE=1
      - LOCALSTACK_PERSISTENCE=1
      - AWS_DEFAULT_REGION=us-east-1
    networks:
      secrets-net:
        aliases:
          - aws.secrets

  # GCP
  # gcp-iam-emulator:
  #   container_name: gcp-iam-emulator
  #   image: ghcr.io/blackwell-systems/gcp-iam-emulator:latest
  #   expose:
  #     - 8080
  #   environment:
  #     - IAM_PORT=8080
  #     - IAM_LOG_LEVEL=info
  #   healthcheck:
  #     test: ["CMD", "wget", "--spider", "-q", "http://localhost:7202/health"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 5

  secrets-gcp-emulator:
    container_name: gcp-secret-emulator
    image: ghcr.io/blackwell-systems/gcp-secret-manager-emulator-dual:latest
    expose:
      - 9090  # gRPC
      - 8080  # REST (avoid conflict with IAM)
    environment:
      - GCP_MOCK_GRPC_PORT=9090
      - GCP_MOCK_HTTP_PORT=8080
      - IAM_MODE=off # permissive
      - IAM_EMULATOR_HOST=gcp-iam-emulator:8080
    # depends_on:
    #   gcp-iam-emulator:
    #     condition: service_healthy
    networks:
      secrets-net:
        aliases:
          - gcp.secrets

  secrets-openbao:
    container_name: openbao
    image: openbao/openbao
    volumes:
      - openbao_server_data:/openbao/config
    expose:
      - 8200
    environment:
      - BAO_DEV_ROOT_TOKEN_ID=dbadmin
      - BAO_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    networks:
      secrets-net:
        aliases:
          - bao.secrets

  secrets-floci-aws:
    container_name: floci-aws
    image: floci/floci:latest
    expose:
      - 4566
    volumes:
      - floci_aws_server_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      FLOCI_HOSTNAME: aws.floci.secrets
      # FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_MODE: wal
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
    networks:
      secrets-net:
        aliases:
          - aws.floci.secrets

  secrets-floci-azr:
    container_name: floci-azr
    image: floci/floci-az:latest
    expose:
      - 4577
    volumes:
      - floci_azr_server_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # FLOCI_AZ_STORAGE_MODE: hybrid      # in-memory + async flush every 5 s (recommended)
      FLOCI_AZ_STORAGE_MODE: wal           # every write goes to disk before responding
      # FLOCI_AZ_STORAGE_MODE: persistent  # flush only on graceful shutdown
      FLOCI_AZ_SERVICES_BLOB_ENABLED: "false"
      FLOCI_AZ_SERVICES_QUEUE_ENABLED: "false"
      FLOCI_AZ_SERVICES_TABLE_ENABLED: "false"
      FLOCI_AZ_SERVICES_FUNCTIONS_ENABLED: "true"
      FLOCI_AZ_SERVICES_APP_CONFIG_ENABLED: "false"
    networks:
      secrets-net:
        aliases:
          - azr.floci.secrets

  secrets-floci-gcp:
    container_name: floci-gcp
    image: floci/floci-gcp:latest
    expose:
      - 4588
    volumes:
      - floci_gcp_server_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      FLOCI_GCP_HOSTNAME: gcp.floci.secrets
      FLOCI_GCP_BASE_URL: http://gcp.floci.secrets:4588
      # FLOCI_GCP_STORAGE_MODE: hybrid
      FLOCI_GCP_STORAGE_MODE: wal
      FLOCI_GCP_STORAGE_PERSISTENT_PATH: /app/data
    networks:
      secrets-net:
        aliases:
          - gcp.floci.secrets

  secrets-floci-ui:
    container_name: floci-ui
    image: floci/floci-ui:latest
    expose:
      - 4500
    environment:
      COMPOSE_PROFILES: multicloud # AWS + Azure + GCP
      API_TARGET: http://floci-api:4501
      VITE_USE_POLLING: "true"
      FLOCI_ENDPOINT: http://aws.floci.secrets:4566
      FLOCI_AZURE_ENDPOINT: http://azr.floci.secrets:4577
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: fake
      AWS_SECRET_ACCESS_KEY: fake
      FLOCI_GCP_ENDPOINT: http://gcp.floci.secrets:4588
      FLOCI_GCP_PROJECT: dbadmin
    networks:
      secrets-net:
        aliases:
          - floci.secrets

volumes:
  infisical_pgsql_data:
    driver: local
    name: infisical_pgsql_data
  infisical_redis_data:
    driver: local
    name: infisical_redis_data
  ministack_server_data:
    driver: local
    name: ministack_server_data
  openbao_server_data:
    driver: local
    name: openbao_server_data
  floci_aws_server_data:
    driver: local
    name: floci_aws_server_data
  floci_azr_server_data:
    driver: local
    name: floci_azr_server_data
  floci_gcp_server_data:
    driver: local
    name: floci_gcp_server_data

networks:
  infisical-net:
    name: infisical-net
  secrets-net:
    name: secrets-net
  secrets-ssl-net:
    name: secrets-ssl-net
