services:

  dbadmin-build-laravel:
    container_name: dbadmin-build-laravel
    build:
      context: ./
      dockerfile: Dockerfile
      args:
        - PHP_USER=dbadmin
        - IMAGE_TAG=laravel
      # Uncomment this section a root CA certificate needs to be installed.
      additional_contexts:
        secrets-ssl: ../ssl
    volumes:
      - ../shared/config/.env.dbadmin:/var/www/.env.dbadmin
      - ../shared/config/laravel/.env:/var/www/.env
      - ../shared/config/app/dbadmin:/var/www/config/dbadmin
      - ../shared/config/laravel/jaxon.php:/var/www/config/jaxon.php
      - ../shared/config/laravel/services/user.php:/var/www/config/dbadmin/services/user.php
      - ../shared/config/laravel/services/storage.php:/var/www/config/dbadmin/services/storage.php
      - ../shared/logs/laravel:/var/www/storage/logs
      - ../shared/users:/var/www/users
      - ../scripts/seeds:/var/www/seeds
      - ../shared/data:/var/www/storage/data
      - ../sqlite:/var/lib/sqlite
      - ../tools/aws:/home/dbadmin/.aws:ro
      - ../tools/gcp:/home/dbadmin/.gcp:ro
    ports:
      - 7311:8080
    networks:
      - dbserver-dev-net
      - secrets-ssl-net

  dbadmin-build-symfony:
    container_name: dbadmin-build-symfony
    build:
      context: ./
      dockerfile: Dockerfile
      args:
        - PHP_USER=dbadmin
        - IMAGE_TAG=symfony
      # Uncomment this section a root CA certificate needs to be installed.
      additional_contexts:
        secrets-ssl: ../ssl
    volumes:
      - ../shared/config/.env.dbadmin:/var/www/.env.dbadmin
      - ../shared/config/symfony/.env:/var/www/.env
      - ../shared/config/app/dbadmin:/var/www/config/dbadmin
      - ../shared/config/symfony/jaxon.yaml:/var/www/config/packages/jaxon.yaml
      - ../shared/config/symfony/services/user.php:/var/www/config/dbadmin/services/user.php
      - ../shared/config/symfony/services/storage.php:/var/www/config/dbadmin/services/storage.php
      - ../shared/logs/symfony:/var/www/var/log
      - ../shared/users:/var/www/users
      - ../scripts/seeds:/var/www/seeds
      - ../shared/data:/var/www/var/data
      - ../sqlite:/var/lib/sqlite
      - ../tools/aws:/home/dbadmin/.aws:ro
      - ../tools/gcp:/home/dbadmin/.gcp:ro
    ports:
      - 7312:8080
    networks:
      - dbserver-dev-net
      - secrets-ssl-net

  dbadmin-build-slim:
    container_name: dbadmin-build-slim
    build:
      context: ./
      dockerfile: Dockerfile
      args:
        - PHP_USER=dbadmin
        - IMAGE_TAG=slim
      # Uncomment this section a root CA certificate needs to be installed.
      additional_contexts:
        secrets-ssl: ../ssl
    volumes:
      - ../shared/config/.env.dbadmin:/var/www/.env.dbadmin:ro
      - ../shared/config/slim/.env:/var/www/.env:ro
      - ../shared/config/app/dbadmin:/var/www/config/dbadmin:ro
      - ../shared/config/slim/jaxon.php:/var/www/config/jaxon.php:ro
      - ../shared/config/slim/services/user.php:/var/www/config/dbadmin/services/user.php:ro
      - ../shared/config/slim/services/storage.php:/var/www/config/dbadmin/services/storage.php:ro
      - ../shared/logs/slim:/var/www/storage/logs
      - ../shared/users:/var/www/users
      - ../scripts/seeds:/var/www/seeds
      - ../shared/data:/var/www/storage/data
      - ../sqlite:/var/lib/sqlite
      - ../tools/aws:/home/dbadmin/.aws:ro
      - ../tools/gcp:/home/dbadmin/.gcp:ro
    ports:
      - 7313:8080
    networks:
      - dbserver-dev-net
      - secrets-ssl-net

networks:
  dbserver-dev-net:
    external: true
  secrets-ssl-net:
    external: true
