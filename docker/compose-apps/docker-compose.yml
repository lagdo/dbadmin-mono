services:

  dbadmin-app-laravel:
    container_name: dbadmin-app-laravel
    build:
      context: ./
      additional_contexts:
        # Give access to the SSL certs dir.
        secrets-ssl: ../ssl
      dockerfile: Dockerfile
      args:
        - PHP_USER=dbadmin
        - PHP_UID=${PHP_UID:-1000}
        - PHP_GID=${PHP_GID:-1000}
        - PHP_FRW=laravel
    user: "${PHP_UID:-1000}:${PHP_GID:-1000}"
    volumes:
      - ../../../dbadmin-app-laravel:/var/www
      - ../compose-dbadmin/config/dbadmin:/var/www/config/dbadmin:ro
      - ./config/laravel/jaxon.php:/var/www/config/jaxon.php:ro
      - ./config/laravel/services/user.php:/var/www/config/dbadmin/services/user.php:ro
      - ./config/laravel/services/storage.php:/var/www/config/dbadmin/services/storage.php:ro
      - ./users:/var/www/users
      - ../scripts/seeds:/var/www/seeds
      - ./data:/var/www/storage/data
      - ../sqlite:/var/lib/sqlite
      - ../tools/aws:/home/dbadmin/.aws:ro
      - ../tools/gcp:/home/dbadmin/.gcp:ro
    ports:
      - 7301:8080
    networks:
      - dbserver-dev-net
      - secrets-ssl-net
    environment:
      - AWS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
      - DB_DATABASE=storage/data/laravel_db.sqlite
      - RUN_COMPOSER=true
      - COMPOSER_OPTIONS=run dbadmin-create-localdb

  dbadmin-app-symfony:
    container_name: dbadmin-app-symfony
    build:
      context: ./
      additional_contexts:
        # Give access to the SSL certs dir.
        secrets-ssl: ../ssl
      dockerfile: Dockerfile
      args:
        - PHP_USER=dbadmin
        - PHP_UID=${PHP_UID:-1000}
        - PHP_GID=${PHP_GID:-1000}
        - PHP_FRW=symfony
    user: "${PHP_UID:-1000}:${PHP_GID:-1000}"
    volumes:
      - ../../../dbadmin-app-symfony:/var/www
      - ../compose-dbadmin/config/dbadmin:/var/www/config/dbadmin:ro
      - ./config/symfony/jaxon.yaml:/var/www/config/packages/jaxon.yaml:ro
      - ./config/symfony/services/user.php:/var/www/config/dbadmin/services/user.php:ro
      - ./config/symfony/services/storage.php:/var/www/config/dbadmin/services/storage.php:ro
      - ./users:/var/www/users
      - ../scripts/seeds:/var/www/seeds
      - ./data:/var/www/var/data
      - ../sqlite:/var/lib/sqlite
      - ../tools/aws:/home/dbadmin/.aws:ro
      - ../tools/gcp:/home/dbadmin/.gcp:ro
    ports:
      - 7302:8080
    networks:
      - dbserver-dev-net
      - secrets-ssl-net
    environment:
      - AWS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
      - DATABASE_URL=sqlite:///%kernel.project_dir%/var/data/symfony_db.sqlite
      - RUN_COMPOSER=true
      - COMPOSER_OPTIONS=run dbadmin-create-localdb

  dbadmin-app-slim:
    container_name: dbadmin-app-slim
    build:
      context: ./
      additional_contexts:
        # Give access to the SSL certs dir.
        secrets-ssl: ../ssl
      dockerfile: Dockerfile
      args:
        - PHP_USER=dbadmin
        - PHP_UID=${PHP_UID:-1000}
        - PHP_GID=${PHP_GID:-1000}
        - PHP_FRW=slim
    user: "${PHP_UID:-1000}:${PHP_GID:-1000}"
    volumes:
      - ../../../dbadmin-app-slim:/var/www
      - ../compose-dbadmin/config/dbadmin:/var/www/config/dbadmin:ro
      - ./config/slim/jaxon.php:/var/www/config/jaxon.php:ro
      - ./config/slim/services/user.php:/var/www/config/dbadmin/services/user.php:ro
      - ./config/slim/services/storage.php:/var/www/config/dbadmin/services/storage.php:ro
      - ./users:/var/www/users
      - ../scripts/seeds:/var/www/seeds
      - ./data:/var/www/storage/data
      - ../sqlite:/var/lib/sqlite
      - ../tools/aws:/home/dbadmin/.aws:ro
      - ../tools/gcp:/home/dbadmin/.gcp:ro
    ports:
      - 7303:8080
    networks:
      - dbserver-dev-net
      - secrets-ssl-net
    environment:
      - AWS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
      - USERS_JSON_FILE=storage/data/slim_users.json

networks:
  dbserver-dev-net:
    external: true
  secrets-ssl-net:
    external: true
