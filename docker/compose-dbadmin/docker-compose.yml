services:

  dbadmin-dev:
    container_name: dbadmin-dev
    build:
      context: ./
      dockerfile: dbadmin/Dockerfile
      target: dbadmin-dev-no-secret
      args:
        - PHP_USER=dbadmin
        - PHP_UID=${PHP_UID:-1000}
        - PHP_GID=${PHP_GID:-1000}
    volumes:
      - ../..:/var/www
      - ./dbadmin/dbadmin-dev:/var/www/dbadmin-demo/app/config/dbadmin:ro
      - ../sqlite:/var/lib/sqlite
    ports:
      - 7090:8080
    networks:
      - dbserver-dev-net

  dbadmin-cli:
    container_name: dbadmin-cli
    stdin_open: true # docker run -i
    tty: true        # docker run -t
    build:
      context: ./
      dockerfile: tools/Dockerfile
      target: dbadmin-cli-no-secret
      args:
        - CLI_USER=dbadmin
        - CLI_UID=${CLI_UID:-1000}
        - CLI_GID=${CLI_GID:-1000}
    volumes:
      - ../tools/mysql/disable-ssl.cnf:/etc/my.cnf.d/disable-ssl.cnf
      - ../scripts/seeds:/home/dbadmin/seeds
      - ../../jaxon-dbadmin/migrations:/home/dbadmin/migrations
      - ../sqlite:/var/lib/sqlite
    networks:
      - dbserver-dev-net

  dbadmin-adminer:
    container_name: dbadmin-adminer
    build:
      context: ./
      dockerfile: adminer/Dockerfile
      args:
        - PHP_USER=adminer
        - PHP_UID=${PHP_UID:-1000}
        - PHP_GID=${PHP_GID:-1000}
    volumes:
      - ../../../adminer:/var/www
      - ../sqlite:/var/lib/sqlite
      # Database connection scripts.
      - ./adminer/editor/pgsql14.php:/var/www/editor/pgsql14.php
      - ./adminer/editor/mysql.php:/var/www/editor/mysql.php
      - ./adminer/editor/maria.php:/var/www/editor/maria.php
    ports:
      - 7080:8080
      - 7081:8081
    networks:
      - dbserver-dev-net

  dbadmin-phpmyadmin:
    container_name: dbadmin-phpmyadmin
    image: phpmyadmin
    restart: always
    environment:
      # - PMA_HOST=dbserver-mariadb
      - PMA_ARBITRARY=1
    ports:
      - 7082:80
    networks:
      - dbserver-dev-net

networks:
  dbserver-dev-net:
    external: true
