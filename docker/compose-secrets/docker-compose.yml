version: "3"

services:
  backend:
    image: infisical/infisical:v0.160.7
    container_name: infisical-backend
    restart: unless-stopped
    depends_on:
      pgsql:
        # condition: service_healthy
        condition: service_started
      redis:
        condition: service_started
    # pull_policy: always
    env_file: .env
    ports:
      - 7200:8080
    environment:
      - NODE_ENV=production
    networks:
      - infisical

  redis:
    image: redis
    container_name: infisical-redis
    env_file: .env
    restart: always
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    networks:
      - infisical
    volumes:
      - infisical_redis_data:/data

  pgsql:
    container_name: infisical-pgsql
    image: postgres:14-alpine
    restart: always
    env_file: .env
    volumes:
      - infisical_pgsql_data:/var/lib/postgresql/data
    networks:
      - infisical
    # healthcheck:
    #   test: "pg_isready --username=${POSTGRES_USER} && psql --username=${POSTGRES_USER} --list"
    #   interval: 5s
    #   timeout: 10s
    #   retries: 10

  ministack:
    container_name: ministack
    image: ministackorg/ministack:latest
    ports:
      - "7201:4566"
    volumes:
      - ministack_server_data:/tmp/ministack-state
    environment:
      - PERSIST_STATE=1
      - AWS_DEFAULT_REGION=us-east-1

  # GCP
  # gcp-iam-emulator:
  #   container_name: gcp-iam-emulator
  #   image: ghcr.io/blackwell-systems/gcp-iam-emulator:latest
  #   ports:
  #     - "7202:8080"
  #   environment:
  #     - IAM_PORT=8080
  #     - IAM_LOG_LEVEL=info
  #   healthcheck:
  #     test: ["CMD", "wget", "--spider", "-q", "http://localhost:7202/health"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 5

  gcp-secret-manager:
    container_name: gcp-secret-manager
    image: ghcr.io/blackwell-systems/gcp-secret-manager-emulator-dual:latest
    ports:
      - "7203:9090"  # gRPC
      - "7204:8080"  # REST (avoid conflict with IAM)
    environment:
      - GCP_MOCK_GRPC_PORT=9090
      - GCP_MOCK_HTTP_PORT=8080
      - IAM_MODE=off # permissive
      - IAM_EMULATOR_HOST=gcp-iam-emulator:8080
    # depends_on:
    #   gcp-iam-emulator:
    #     condition: service_healthy

  openbao:
    container_name: openbao
    image: openbao/openbao
    volumes:
      - openbao_server_data:/openbao/config
    ports:
      - "7205:8200"
    environment:
      - BAO_DEV_ROOT_TOKEN_ID=dbadmin
      - BAO_DEV_LISTEN_ADDRESS=0.0.0.0:8200

  # azure-vault:
  #   container_name: azure-vault
  #   image: jamesgoulddev/azure-keyvault-emulator:latest
  #   volumes:
  #     - ../certs/azure:/certs
  #   ports:
  #     - "7206:4997"
  #   environment:
  #     - Persist=true

  # Disabled because for now, Floci doesn't provide secrets persistance, while Ministack does.
  # floci:
  #   container_name: floci
  #   image: hectorvent/floci:latest
  #   ports:
  #     - "7207:4566"
  #   environment:
  #     - FLOCI_STORAGE_MODE=persistent
  #     - FLOCI_STORAGE_PERSISTENT_PATH=/data/floci
  #     - FLOCI_DEFAULT_REGION=us-east-1
  #   volumes:
  #     - floci_server_data:/data/floci

volumes:
  infisical_pgsql_data:
    driver: local
    name: infisical_pgsql_data
  infisical_redis_data:
    driver: local
    name: infisical_redis_data
  # floci_server_data:
  #   driver: local
  #   name: floci_server_data
  ministack_server_data:
    driver: local
    name: ministack_server_data
  openbao_server_data:
    driver: local
    name: openbao_server_data

networks:
  infisical:
